name: PR Review Loop

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-review-loop-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review-and-fix:
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run review/fix loop
        id: loop
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-4.1-mini' }}
          OPENAI_FIX_MODEL: ${{ vars.OPENAI_FIX_MODEL || 'gpt-4.1-mini' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          base_sha="${{ github.event.pull_request.base.sha }}"
          max_attempts=5

          if [ -f .loop-state.json ]; then
            current=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.loop-state.json', 'utf8')).attempts ?? 0)")
          else
            current=0
          fi

          final_score=0
          final_attempt="$current"
          final_reason="retry_limit"

          while [ "$current" -lt "$max_attempts" ]; do
            attempt=$((current + 1))
            head_sha=$(git rev-parse HEAD)

            node scripts/review.mjs --base "$base_sha" --head "$head_sha" --out artifacts/review-result.json
            score=$(node -e "console.log(JSON.parse(require('fs').readFileSync('artifacts/review-result.json', 'utf8')).score)")
            final_score="$score"
            final_attempt="$attempt"

            if [ "$score" -ge 8 ]; then
              final_reason="score_reached"
              break
            fi

            node scripts/fix.mjs --review artifacts/review-result.json --attempt "$attempt"

            set +e
            npm test 2>&1 | tee artifacts/test-output.txt
            test_exit=${PIPESTATUS[0]}
            set -e

            if [ "$test_exit" -eq 0 ]; then
              test_status="success"
            else
              test_status="failure"
            fi

            node -e "const fs=require('fs');const statePath='.loop-state.json';const testPath='artifacts/test-output.txt';const state=fs.existsSync(statePath)?JSON.parse(fs.readFileSync(statePath,'utf8')):{};const raw=fs.existsSync(testPath)?fs.readFileSync(testPath,'utf8'):'';state.testFeedback={status:process.argv[1],summary:raw.split(/\\r?\\n/).slice(-40).join('\\n').slice(0,6000)};fs.writeFileSync(statePath,JSON.stringify(state,null,2)+'\\n');" "$test_status"

            if git diff --quiet; then
              final_reason="no_diff"
              break
            fi

            git add src test .loop-state.json
            git commit -m "chore: automated review loop fix attempt $attempt"
            git push

            current="$attempt"
            final_reason="pushed_retry"
          done

          echo "score=$final_score" >> "$GITHUB_OUTPUT"
          echo "attempt=$final_attempt" >> "$GITHUB_OUTPUT"
          echo "reason=$final_reason" >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment
        uses: actions/github-script@v8
        env:
          SCORE: ${{ steps.loop.outputs.score }}
          ATTEMPT: ${{ steps.loop.outputs.attempt }}
          REASON: ${{ steps.loop.outputs.reason }}
          REVIEW_FILE: artifacts/review-result.json
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-review-loop -->';
            const review = JSON.parse(fs.readFileSync(process.env.REVIEW_FILE, 'utf8'));
            const issues = review.issues.length
              ? review.issues.map((issue) => `- ${issue.path}: ${issue.title} (${issue.severity})`).join('\n')
              : '- No blocking issues detected.';
            const reasonMap = {
              score_reached: 'Stopped because score reached the merge threshold.',
              retry_limit: 'Stopped because retry limit was reached.',
              no_diff: 'Stopped because fixer produced no file changes.',
              pushed_retry: 'Pushed automated retry commit(s).'
            };
            const body = [
              marker,
              `## PR Review Loop`,
              `Score: ${process.env.SCORE}/10`,
              `Attempt: ${process.env.ATTEMPT}/5`,
              `Status: ${reasonMap[process.env.REASON] ?? process.env.REASON}`,
              '',
              review.summary,
              '',
              'Issues:',
              issues
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
